name: Controllo modulo di contatto

# Invia un messaggio di prova al modulo di contatto (Web3Forms).
# Si lancia SOLO a mano da Actions > "Controllo modulo di contatto" > Run workflow.
# Non e' programmato ogni settimana: nel piano gratuito Web3Forms puo' rifiutare le
# richieste che arrivano da server come quelli di GitHub, e avresti un falso errore
# ogni lunedi'. Per un controllo affidabile invia un messaggio dal sito pubblico.
on:
  workflow_dispatch:

jobs:
  form:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 Script_Python/test_form.py
