name: Controllo modulo di contatto

# Ogni lunedi' invia un messaggio di prova al modulo di contatto. Se il servizio
# di inoltro non risponde o non e' piu' attivo il workflow fallisce e GitHub ti
# avvisa via email. Il messaggio "[TEST AUTOMATICO]" deve anche arrivare nella
# casella dell'attivita': se una settimana manca, controlla spam e consegna.
# Si puo' lanciare a mano da Actions > "Controllo modulo di contatto" > Run workflow.
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

jobs:
  form:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 Script_Python/test_form.py
